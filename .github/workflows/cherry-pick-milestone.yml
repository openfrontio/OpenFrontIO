# Thin caller for the shared milestone backport in openfrontio/.github. Only
# the trigger lives here; the pick, Claude conflict resolution and backport PR
# are in the shared file:
# https://github.com/openfrontio/.github/blob/main/.github/workflows/cherry-pick-milestone.yml
#
# A merged PR with milestone "v34" is cherry-picked onto branch v34. closed
# covers a PR milestoned before merge, milestoned one milestoned after.
# pull_request_target so fork PRs get secrets; only the already-merged commit
# is picked.
name: 🍒 Cherry-pick to milestone

on:
  pull_request_target:
    types: [closed, milestoned]

jobs:
  cherry-pick:
    uses: openfrontio/.github/.github/workflows/cherry-pick-milestone.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
