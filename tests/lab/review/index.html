<!doctype html> <meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>Lab game review</title>
<style>
  :root {
    --bg: #f4f3ee;
    --panel: #fff;
    --ink: #1d1f1a;
    --muted: #6b6f63;
    --line: #d9d7cc;
    --me: #2f8f4e;
    --ally: #3a7bd5;
    --accent: #b5451b;
    --sea: #6f93b8;
    --land: #d9cfae;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614;
      --panel: #1d1f1b;
      --ink: #ece9df;
      --muted: #9a9c92;
      --line: #33352f;
      --sea: #2b4a66;
      --land: #5c5540;
    }
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font:
      14px/1.45 system-ui,
      sans-serif;
    margin: 0;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 17px;
    margin: 0;
  }
  select,
  button {
    font: inherit;
    padding: 4px 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    border-radius: 4px;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
    gap: 16px;
    padding: 16px 20px;
  }
  @media (max-width: 900px) {
    main {
      grid-template-columns: 1fr;
    }
  }
  .map {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
  }
  canvas {
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    display: block;
  }
  .ctl {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
  }
  .ctl input {
    flex: 1;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 14px;
    max-height: 44vh;
    overflow: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  th,
  td {
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--line);
  }
  .n {
    text-align: right;
  }
  tr.me td {
    color: var(--me);
    font-weight: 600;
  }
  tr.ally td {
    color: var(--ally);
  }
  .log {
    font:
      12px/1.5 ui-monospace,
      monospace;
    white-space: pre-wrap;
  }
  .log .now {
    color: var(--accent);
  }
  .legend {
    display: flex;
    gap: 14px;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }
  .sw {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .sub {
    color: var(--muted);
  }
</style>
<header>
  <h1>Lab game review</h1>
  <select id="games"></select
  ><span id="meta" class="sub"></span>
</header>
<main>
  <section class="map">
    <canvas id="c" width="500" height="250"></canvas>
    <div class="ctl">
      <button id="play">Play</button
      ><input id="t" type="range" min="0" max="0" value="0" /><span id="clock"
        >0:00</span
      >
    </div>
    <div class="legend">
      <span><i class="sw" style="background: var(--me)"></i>the bot</span
      ><span><i class="sw" style="background: var(--ally)"></i>its allies</span
      ><span><i class="sw" style="background: #c98a2e"></i>nations</span
      ><span><i class="sw" style="background: #8a8a8a"></i>tribes</span
      ><span><i class="sw" style="background: var(--land)"></i>free land</span>
    </div>
    <div id="econ" class="sub" style="margin-top: 8px"></div>
  </section>
  <aside>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th class="n">Tiles</th>
            <th class="n">Troops</th>
            <th class="n">Cities</th>
            <th class="n">Ports</th>
          </tr>
        </thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="panel log" id="log"></div>
  </aside>
</main>
<script>
  let D = null,
    land = null,
    img = null;
  const cv = document.getElementById("c"),
    ctx = cv.getContext("2d"),
    sl = document.getElementById("t");
  const css = (v) =>
    getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const hex = (h) => {
    h = h.replace("#", "");
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16),
    ];
  };
  const nationCol = (id) => {
    const h = (id * 2654435761) >>> 0;
    return [150 + (h & 63), 100 + ((h >> 8) & 63), 40 + ((h >> 16) & 31)];
  };
  function draw(f) {
    if (!D) return;
    const fr = D.frames[f];
    const types = new Map(fr.players.map((p) => [p[0], p]));
    const cSea = hex(css("--sea")),
      cLand = hex(css("--land")),
      cMe = hex(css("--me")),
      cAlly = hex(css("--ally"));
    let i = 0;
    const px = img.data;
    for (let k = 0; k < fr.rle.length; k += 2) {
      const v = fr.rle[k],
        n = fr.rle[k + 1];
      let col = null;
      if (v !== 0) {
        if (v === D.me) col = cMe;
        else {
          const p = types.get(v);
          col = p
            ? p[7]
              ? cAlly
              : p[2] === "B"
                ? [138, 138, 138]
                : nationCol(v)
            : [120, 120, 120];
        }
      }
      for (let j = i; j < i + n; j++) {
        const c = col || (land[j] ? cLand : cSea);
        const o = j * 4;
        px[o] = c[0];
        px[o + 1] = c[1];
        px[o + 2] = c[2];
        px[o + 3] = 255;
      }
      i += n;
    }
    ctx.putImageData(img, 0, 0);
    const t = fr.t / 10;
    document.getElementById("clock").textContent =
      Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
    const nb = fr.players
      .filter((p) => p[2] !== "B")
      .sort((a, b) => b[3] - a[3]);
    const mine = fr.players.find((p) => p[0] === D.me);
    const top = nb.slice(0, 16);
    if (mine && !top.includes(mine)) top.push(mine);
    document.getElementById("tb").innerHTML = top
      .map(
        (p) =>
          `<tr class="${p[0] === D.me ? "me" : p[7] ? "ally" : ""}"><td>${nb.indexOf(p) + 1}</td><td>${p[1]}</td><td class="n">${p[3].toLocaleString()}</td><td class="n">${Math.round(p[4] / 1000)}k</td><td class="n">${p[5]}</td><td class="n">${p[6]}</td></tr>`,
      )
      .join("");
    const lines = D.log
      .map((l) => {
        const m = /^t(\d+)/.exec(l);
        return [m ? +m[1] : 0, l];
      })
      .filter((x) => x[0] <= fr.t);
    const el = document.getElementById("log");
    el.innerHTML = lines
      .slice(-80)
      .map(
        (x, i, a) =>
          `<div class="${i === a.length - 1 ? "now" : ""}">${x[1].replace(/[<>]/g, "")}</div>`,
      )
      .join("");
    el.scrollTop = el.scrollHeight;
    const rows = D.rows.filter((r) => /^\s+\d+s /.test(r));
    document.getElementById("econ").textContent = (
      rows[Math.min(f, rows.length - 1)] || ""
    )
      .replace(/bots=\d+ botTroops=\d+ botTiles=\d+ nearBotTroops=\S+ /, "")
      .trim();
  }
  async function load(name) {
    D = await (await fetch("/games/" + name)).json();
    cv.width = D.w;
    cv.height = D.h;
    img = ctx.createImageData(D.w, D.h);
    land = new Uint8Array(D.w * D.h);
    {
      let i = 0;
      for (let k = 0; k < D.land.length; k += 2) {
        land.fill(D.land[k], i, i + D.land[k + 1]);
        i += D.land[k + 1];
      }
    }
    sl.max = D.frames.length - 1;
    sl.value = 0;
    const fin = (D.rows.find((r) => r.includes("FINAL")) || "").trim();
    document.getElementById("meta").textContent =
      `${D.label} · ${D.difficulty} · spawn ${D.spawn[0]},${D.spawn[1]} · ${fin}`;
    draw(0);
    location.hash = name;
  }
  async function list() {
    const g = await (await fetch("/games")).json();
    const sel = document.getElementById("games");
    sel.innerHTML = g
      .map((x) => `<option value="${x.file}">${x.name} · ${x.summary}</option>`)
      .join("");
    const want = location.hash.slice(1);
    if (want && g.some((x) => x.file === want)) sel.value = want;
    sel.onchange = () => load(sel.value);
    if (g.length) load(sel.value);
  }
  sl.oninput = () => draw(+sl.value);
  let timer = null;
  document.getElementById("play").onclick = function () {
    if (timer) {
      clearInterval(timer);
      timer = null;
      this.textContent = "Play";
      return;
    }
    this.textContent = "Pause";
    timer = setInterval(() => {
      if (+sl.value >= +sl.max) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play").textContent = "Play";
        return;
      }
      sl.value = +sl.value + 1;
      draw(+sl.value);
    }, 700);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () =>
    draw(+sl.value),
  );
  list();
</script>
